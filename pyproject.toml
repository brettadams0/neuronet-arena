[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuronet-arena"
version = "2.0.0"
description = "An evolution simulator: small neural networks and a genetic algorithm, written from scratch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brett Adams", email = "adamsbrett00@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.optional-dependencies]
viewer = ["pygame>=2.5"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
neuronet = "neuronet.cli:main"

[project.urls]
Demo = "https://brettadams0.github.io/neuronet-arena/"
Source = "https://github.com/brettadams0/neuronet-arena"

[tool.hatch.build.targets.wheel]
packages = ["src/neuronet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: runs many generations (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the docs use ×, ·, − on purpose

[tool.mypy]
strict = true
files = ["src/neuronet"]

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true
